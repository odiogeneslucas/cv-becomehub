<style>
:root{
  --bg:#0c0e14; --bg-soft:#13161f; --card:#171a24; --card-2:#1d212d;
  --text:#eef1f7; --muted:#9aa3b5; --border:#262b39;
  --accent:#7c5cff; --accent-2:#22d3ee; --accent-grad:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%);
  --ok:#34d399; --shadow:0 10px 40px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f6f7fb; --bg-soft:#eef1f7; --card:#ffffff; --card-2:#f3f5fa;
  --text:#13161f; --muted:#5b6577; --border:#e2e6ef;
  --accent:#6b46ff; --accent-2:#0891b2; --shadow:0 10px 40px rgba(20,30,60,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}
section{padding:64px 0}
h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.eyebrow{color:var(--accent);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.muted{color:var(--muted)}
.grad{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Header */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent-grad);display:inline-block}
.controls{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 16px;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.18s;font-family:inherit}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn.primary{background:var(--accent-grad);border:none;color:#fff}
.btn.sm{padding:7px 11px;font-size:.82rem}
.toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.toggle button{background:transparent;border:none;color:var(--muted);padding:7px 11px;cursor:pointer;font-weight:700;font-size:.8rem;font-family:inherit}
.toggle button.active{background:var(--accent);color:#fff}

/* Hero */
.hero{padding:72px 0 40px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-120px;right:-120px;width:420px;height:420px;background:var(--accent-grad);filter:blur(120px);opacity:.18;border-radius:50%}
.hero-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-bottom:14px}
.hero .roles{font-weight:700;color:var(--accent);font-size:1.05rem;margin-bottom:14px}
.hero p.lead{color:var(--muted);font-size:1.05rem;max-width:46ch;margin-bottom:24px}
.cta-row{display:flex;flex-wrap:wrap;gap:10px}
.photo{aspect-ratio:1;border-radius:24px;background:var(--card-2) center/cover;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;box-shadow:var(--shadow)}

/* Métricas */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:36px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.metric .n{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.metric .l{color:var(--muted);font-size:.86rem;margin-top:4px}

/* Cards genéricos */
.cards{display:grid;gap:14px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;transition:.18s}
.card:hover{border-color:var(--accent)}
.card h3{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.card p{color:var(--muted);font-size:.92rem}
.chip{display:inline-block;background:var(--card-2);border:1px solid var(--border);color:var(--muted);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;margin:3px 4px 0 0}

/* Journey */
.timeline{position:relative;margin-top:24px}
.tl-item{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-co{font-weight:800}
.tl-per{color:var(--muted);font-size:.84rem}
.tl-role{font-weight:600;color:var(--accent)}
.tl-desc{color:var(--muted);font-size:.92rem;margin:4px 0 8px}

/* Match My Job */
.match{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.match textarea{width:100%;min-height:120px;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px;font-family:inherit;font-size:.92rem;resize:vertical}
.match-result{margin-top:18px;display:none}
.score-ring{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--border) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring span{width:92px;height:92px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800}
.matchlist{flex:1;min-width:220px}
.matchlist .row{display:flex;align-items:center;gap:8px;font-size:.9rem;padding:3px 0}
.disc{font-size:.78rem;color:var(--muted);margin-top:14px;font-style:italic}

/* AI Match toggle */
.ai-toggle-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ai-switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:.88rem;font-weight:600;color:var(--muted)}
.ai-switch input{opacity:0;width:0;height:0;position:absolute}
.ai-switch .track{width:42px;height:24px;background:var(--border);border-radius:999px;transition:.2s;flex:none}
.ai-switch input:checked + .track{background:var(--accent)}
.ai-switch .track::after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.ai-switch input:checked ~ .track::after{left:21px}
.ai-badge{font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}

/* AI analysis result */
.ai-analysis{margin-top:16px;background:var(--bg-soft);border:1px solid var(--border);border-radius:14px;padding:18px;font-size:.92rem;line-height:1.65;display:none}
.ai-analysis.visible{display:block}
.ai-loading{display:none;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;margin-top:14px}
.ai-loading.visible{display:flex}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:.84rem;font-weight:600}
input,textarea,select{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 13px;font-family:inherit;font-size:.92rem}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.hp{position:absolute;left:-9999px}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:.82rem;color:var(--muted)}
.consent input{margin-top:3px}
.more-toggle{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-family:inherit;font-size:.86rem;padding:0}
.optional{display:none}
.formmsg{display:none;padding:12px 14px;border-radius:10px;font-size:.9rem;margin-top:10px}
.formmsg.ok{display:block;background:color-mix(in srgb,var(--ok) 18%,transparent);border:1px solid var(--ok)}
.formmsg.err{display:block;background:color-mix(in srgb,#f87171 18%,transparent);border:1px solid #f87171}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;max-width:520px;width:100%;padding:28px;box-shadow:var(--shadow);max-height:85vh;overflow:auto}
.modal h3{font-size:1.3rem;margin-bottom:4px}
.modal .res{margin:12px 0}
.modal .res div{padding:3px 0;font-size:.92rem}

footer{border-top:1px solid var(--border);padding:30px 0;color:var(--muted);font-size:.86rem}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:820px){
  .hero-grid{grid-template-columns:1fr}.photo{max-width:240px;order:-1}
  .metrics{grid-template-columns:1fr 1fr}.cols-2,.cols-3,.form-grid{grid-template-columns:1fr}
  .tl-item{grid-template-columns:1fr}
}
</style>
</head>

/* ============================================================
   MATCH MY JOB
   ============================================================ */
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}

/* Modo JS: keywords */
function runKeywordMatch(txt){
  let totalW=0,gotW=0;const rows=[];
  SKILLS.forEach(s=>{
    totalW+=s.weight;
    const hits=s.kw.reduce((a,k)=>a+(txt.includes(norm(k))?1:0),0);
    const sc=Math.min(1,hits/1)*s.weight; gotW+=sc;
    rows.push({label:s.label[lang],hit:hits>0});
  });
  const score=Math.round(gotW/totalW*100);
  document.getElementById("matchres").style.display="block";
  document.getElementById("aianalysis").classList.remove("visible");
  const ring=document.getElementById("ring");ring.style.setProperty("--p",score);
  document.getElementById("scoreval").textContent=score+"%";
  document.getElementById("matchlist").innerHTML=rows.map(r=>`<div class="row">${r.hit?"✅":"⚪"} ${r.label}</div>`).join("");
  track("match_run");
}

/* Modo IA: DeepSeek via N8N */
async function runAiMatch(jobText){
  const loading=document.getElementById("ailoading");
  const result=document.getElementById("aianalysis");
  const jsResult=document.getElementById("matchres");

  loading.classList.add("visible");
  result.classList.remove("visible");
  jsResult.style.display="none";

  /* Payload enviado ao N8N.
     O N8N deve:
     1. Chamar a API DeepSeek com o prompt abaixo como referência
     2. Retornar JSON: { score: number, analysis: string }
     3. Gravar em Supabase na tabela cv_match_logs */
  const payload = {
    job_description: jobText,
    cv: CV_TEXT,
    lang: lang,
    source: "cv.becomehub.com.br",
    ts: new Date().toISOString(),
    /* Prompt de referência para configurar no N8N / DeepSeek:
       Você receberá uma descrição de vaga e um currículo.
       Analise a compatibilidade e responda APENAS em JSON válido, sem texto fora do JSON:
       { "score": <número de 0 a 100>, "analysis": "<texto amigável de até 300 palavras no idioma {{lang}},
       explicando os pontos de compatibilidade e o que poderia ser fortalecido,
       sem usar o sinal de hífen duplo>" } */
    prompt_hint: `Analise a compatibilidade entre a vaga e o CV. Responda em JSON: { "score": number 0-100, "analysis": "texto ate 300 palavras em ${lang === "pt" ? "português" : "english"}, amigável e direto, sem usar o sinal de hifen duplo" }`
  };

  try{
    const r = await fetch(CONFIG.matchAiEndpoint, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    if(!r.ok) throw new Error("http_error");
    const data = await r.json();

    const score = typeof data.score === "number" ? Math.min(100, Math.max(0, data.score)) : 0;
    const analysis = data.analysis || t("match.ai_err");

    /* Exibe score ring + análise textual */
    jsResult.style.display="block";
    const ring=document.getElementById("ring");ring.style.setProperty("--p",score);
    document.getElementById("scoreval").textContent=score+"%";
    document.getElementById("matchlist").innerHTML="";

    result.innerHTML = analysis.replace(/\n/g,"<br>");
    result.classList.add("visible");
    track("match_run_ai");
  } catch(_){
    result.innerHTML = `<span style="color:#f87171">${t("match.ai_err")}</span>`;
    result.classList.add("visible");
    jsResult.style.display="none";
  } finally {
    loading.classList.remove("visible");
  }
}

document.getElementById("matchbtn").onclick=()=>{
  const raw = document.getElementById("jobtext").value;
  if(raw.trim().length < 20){
    alert(lang==="pt"?"Cole uma descrição de vaga mais completa.":"Please paste a longer job description.");
    return;
  }
  const aiMode = document.getElementById("aimode").checked;
  if(aiMode){
    runAiMatch(raw.trim());
  } else {
    runKeywordMatch(norm(raw));
  }
};

document.getElementById("form").onsubmit=async e=>{

  const payload={

    job_link:f.job_link.value, salary_range:f.salary_range.value,
    consent:f.consent.checked, source:"cv.becomehub.com.br",

  };
